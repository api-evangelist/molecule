aid: molecule
name: Molecule
description: >-
  Molecule is decentralized-science (DeSci) infrastructure for recording,
  tokenizing, funding, and accelerating scientific research onchain. Backed by
  Speedinvest, Molecule lets researchers create onchain Labs (secure research
  datarooms), mint IP-NFTs that register legal intellectual-property rights,
  fractionalize them into tradeable ERC-20 IP Tokens (IPTs), and raise funding
  from a global community. Its developer platform exposes a GraphQL API — a Data
  API for browsing IP-NFTs, IPTs, and market data; a Tokenization API for
  minting and fractionalizing IP; and a Labs API for managing research
  datarooms — plus an x402 pay-per-call HTTP 402 gateway for autonomous agents,
  a hosted Model Context Protocol (MCP) server, and MIRA/BIOS AI tooling. The
  onchain stack (ERC-4337/6551/7579 smart accounts, ERC-7484 module registry,
  IP-NFTs) is deployed on Base and audited by Cyfrin and Pashov.
