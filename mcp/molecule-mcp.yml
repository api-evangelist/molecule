tools:
- name: molecule-get-labs
  description: 'List the labs on Molecule with their verification status, Technology Readiness Level (TRL),
    project format and therapeutic fields, plus each lab''s token when it has one: symbol, chain, holder
    count, price, 24h change, market cap, liquidity and 24h volume. Useful for exploring labs and tokens
    or summarizing Molecule ecosystem statistics.'
- name: molecule-get-lab-activity
  description: 'Fetch the latest activity of a lab''s data room: announcements and files added, updated
    or removed, newest first. Accepts the lab''s slug, name or token symbol. Ideal for tracking project
    progress or updates for specific biotech/research initiatives.'
- name: molecule-get-lab-categories
  description: Retrieve the therapeutic fields labs are grouped into (e.g. Longevity, Brain Health, Women's
    Health) with the labs in each — including their Technology Readiness Level (TRL) and, for labs with
    a token, liquidity, market cap, price and 24h volume. Perfect for exploring DeSci research areas by
    focus.
- name: molecule-get-lab-summary
  description: Gets a comprehensive summary of a lab on Molecule, by its slug, name or token symbol. Combines
    the lab's profile (research focus, team, Technology Readiness Level, assessment score, funding, therapeutic
    fields and links), its token with market data and 14-day price history when it has one, and its recent
    data room activity into a single response. Includes a text template that can be used to format the
    summary for presentation. Useful for getting a complete overview of a biotech/DeSci project.
- name: molecule-get-token-price-history
  description: Gets the historic prices of a lab's token on Molecule, by the lab's slug, name or token
    symbol. Returns daily OHLCV data in USD from the token's most traded market.
